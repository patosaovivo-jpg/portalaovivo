# ============================================
# SISTEMA DE PUBLICIDADE DO PORTAL AO VIVO
# Cada espaço exibe um iframe que busca uma
# IMAGEM ALEATÓRIA da pasta correspondente.
#
# Pastas: ads_topo, ads_esquerda, ads_lateral,
#         ads_materia, ads_rodape
# Para anunciar: coloque a imagem na pasta e
# adicione o nome em assets/js/ads.js.
# Defina "ativo: true" para exibir o anúncio.
# ============================================

# 1) BANNER TOPO - acima do slider (970x90 / 728x90)
topo:
  ativo: true

# 2) BANNER ESQUERDA - coluna da esquerda (160x600) - desativado (coluna removida da home)
esquerda:
  ativo: false

# 3) BANNER LATERAL DIREITA - coluna lateral (300x250)
lateral:
  ativo: true

# 4) BANNER MATÉRIA - dentro da matéria (728x90)
materia:
  ativo: true

# 5) BANNER RODAPÉ - fim de cada matéria (728x90)
rodape:
  ativo: true
