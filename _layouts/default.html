<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.resumo %}{{ page.resumo }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.resumo %}{{ page.resumo }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{ site.title }}">
  {% if page.image %}
    {% if page.image contains '://' %}
      <meta property="og:image" content="{{ page.image }}">
    {% else %}
      <meta property="og:image" content="{{ site.url }}{{ page.image }}">
    {% endif %}
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
  {% endif %}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.resumo %}{{ page.resumo }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  {% if page.image %}
    {% if page.image contains '://' %}
      <meta name="twitter:image" content="{{ page.image }}">
    {% else %}
      <meta name="twitter:image" content="{{ site.url }}{{ page.image }}">
    {% endif %}
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.svg' | relative_url }}">
</head>
<body>

  <!-- Header puxado dinamicamente do fragmento único -->
  <div data-fragment="{{ '/parts/header.html' | relative_url }}"></div>

  <!-- Banner de publicidade do topo puxado dinamicamente -->
  <div data-fragment="{{ '/parts/banner-topo.html' | relative_url }}"></div>

  <main class="container content">
    {{ content }}
  </main>

  <!-- Rodapé puxado dinamicamente do fragmento único -->
  <div data-fragment="{{ '/parts/footer.html' | relative_url }}"></div>

  <script src="{{ '/assets/js/layout.js' | relative_url }}"></script>
</body>
</html>
