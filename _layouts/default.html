<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  {% if page.image %}<meta property="og:image" content="{{ site.url }}{{ page.image }}">{% endif %}
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  {% seo %}
</head>
<body>

  <!-- Header puxado dinamicamente do fragmento único -->
  <div data-fragment="{{ '/parts/header.html' | relative_url }}"></div>

  <!-- Banner de publicidade do topo puxado dinamicamente -->
  <div data-fragment="{{ '/parts/banner-topo.html' | relative_url }}"></div>

  <main class="container content">
    {{ content }}
  </main>

  <!-- Rodapé puxado dinamicamente do fragmento único -->
  <div data-fragment="{{ '/parts/footer.html' | relative_url }}"></div>

  <script src="{{ '/assets/js/layout.js' | relative_url }}"></script>
</body>
</html>
