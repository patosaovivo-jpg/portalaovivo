<!-- ===== BANNER PUBLICIDADE - TOPO (Google AdSense) ===== -->
<div class="ad-banner ad-topo">
  <div class="container">
    <span class="ad-label">Publicidade</span>
    {% if site.data.ads.topo.ativo %}
    <ins class="adsbygoogle ad-frame-topo"
         style="display:inline-block;width:728px;height:90px"
         data-ad-client="ca-pub-0558735938398559"
         data-ad-slot="0"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    {% else %}
    <div class="ph-ph ph-topo">Espaço para banner (728x90)</div>
    {% endif %}
  </div>
</div>
