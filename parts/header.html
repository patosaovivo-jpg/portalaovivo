<!-- ===== CABEÇALHO COM LOGO (fragmento único - vale para todo o site) ===== -->
<header class="site-header">
  <div class="container">
    <div class="header-top">
      <a class="logo" href="{{ '/' | relative_url }}" aria-label="Portal Ao Vivo">
        <span class="logo-play">&#9654;</span>
        <span class="logo-texto">
          <span class="logo-linha1">PORTAL</span>
          <span class="logo-linha2">AO&nbsp;VIVO</span>
        </span>
      </a>
      <div class="header-ad">
        {% if site.data.ads.header.ativo %}
        <span class="ad-label" style="position:static;display:block;text-align:center;">Publicidade</span>
        <ins class="adsbygoogle ad-frame-header"
             style="display:inline-block;width:180px;height:60px"
             data-ad-client="ca-pub-0558735938398559"
             data-ad-slot="0"></ins>
        {% endif %}
      </div>
      <div class="header-data" id="header-data"></div>
    </div>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Início</a>
      <a href="{{ '/' | relative_url }}#ultimas">Últimas</a>
      <a href="{{ '/' | relative_url }}#politica">Política</a>
      <a href="{{ '/' | relative_url }}#cidades">Cidades</a>
      <a href="{{ '/' | relative_url }}#esportes">Esportes</a>
      <a href="{{ '/' | relative_url }}#geral">Geral</a>
      <a href="https://wa.me/5534996988262?text=Ol%C3%A1%2C%20vim%20pelo%20Portal%20Ao%20Vivo!" target="_blank" rel="noopener">Contato</a>
    </nav>
  </div>
  <script>
  (function(){
    var dias=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    var meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    var d=new Date();
    document.getElementById('header-data').textContent=dias[d.getDay()]+', '+d.getDate()+' de '+meses[d.getMonth()]+' de '+d.getFullYear();
    // Dispara o carregamento do AdSense do slot do header ao ser injetado
    {% if site.data.ads.header.ativo %}
    try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
    {% endif %}
  })();
  </script>
</header>
